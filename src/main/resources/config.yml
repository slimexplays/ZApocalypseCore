  boss: { name: '&4Boss', health: 180.0, damage: 12.0, speed: 0.22, resistance: 0.9, spawn-chance: 0.002, drop-chance: 1.0 }
  stealth: { name: '&8Stealth', health: 20.0, damage: 4.0, speed: 0.26, resistance: 0.0, spawn-chance: 0.03, drop-chance: 0.18 }
  mutated: { name: '&5Mutated', health: 32.0, damage: 5.0, speed: 0.28, resistance: 0.3, spawn-chance: 0.01, drop-chance: 0.35 }
  revenant: { name: '&4Infected Revenant', health: 50.0, damage: 7.0, speed: 0.28, resistance: 0.4, spawn-chance: 0.0, drop-chance: 0.4 }

infection:
  enabled: true
  bite-probability: 0.12
  infected-after-seconds: 900
  critical-after-seconds: 1800
  critical-death-after-seconds: 0 # Disabled by default; 0 means infection is non-lethal.
  revenant-enabled: true
  immunity-after-cure-seconds: 0

regional-infection:
  enabled: true
  automatic-spread: false
  update-interval-ticks: 1200
  regions-per-update: 16
  max-regions: 256
  spread-radius-blocks: 512.0
  spread-threshold: 50.0
  spread-per-update: 1.0
  decay-per-update: 0.25
  notify-players: true
  transition-message: '&cRegion %region% is now %type%.'
  spawn-pressure:
    enabled: true
    ambient-attempts-at-100: 2
    horde-size-at-100: 4
  thresholds:
    quarantined: 25.0
    contaminated: 50.0
    high-risk: 75.0
  infection-chance-multipliers:
    clean: 1.0
    quarantined: 1.1
    contaminated: 1.25
    high-risk: 1.5
  regions: {} # Define named cuboids in already-existing worlds; no worlds or structures are created.

