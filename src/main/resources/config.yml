# ZApocalypseCore
# Made By @slimexplays | SlimeX Development | https://dsc.gg/slimexdev

general:
  enabled: true
  debug: false
  max-zombies-per-world: 200
  max-spawn-per-command: 10

worlds:
  enabled: true
  enabled-worlds: [] # Empty means all worlds.

spawning:
  enabled: true
  interval-ticks: 1200
  attempts-per-player: 1
  min-distance-blocks: 24
  max-distance-blocks: 48
  night-only: true
  hordes:
    enabled: true
    interval-ticks: 12000
    min-size: 3
    max-size: 6

# Applies only during vanilla rain in enabled worlds. The event stops affecting players after its duration;
# it does not alter weather or blocks. Shelter is determined by the highest block at the player's column.
acid-rain:
  enabled: false
  damage-interval-seconds: 5
  event-duration-seconds: 600
  exposure-damage: 1.0
  infection-chance-per-exposure: 0.0
  warning: '&cAcid rain is burning your exposed skin!'

toxic-fog:
  enabled: false
  region-types: [contaminated, high-risk]
  damage-interval-seconds: 5
  exposure-damage: 0.5
  infection-chance-per-exposure: 0.02
  effect: POISON
  effect-duration-ticks: 100
  effect-amplifier: 0
  warning: '&2Toxic fog is burning your lungs!'

devices:
  enabled: true
  max-devices: 512
  power:
    radius-blocks: 32.0
    fuel-ticks-per-coal: 1200
    fuel-ticks-per-second: 20
    generator-output-units: 4
    battery-output-units: 2
    battery-capacity-seconds: 3600
    battery-charge-ticks-per-second: 20
    battery-charge-load: 1
    charger-radius-blocks: 6
    phone-charge-percent-per-second: 1
    consumer-loads: { camera: 1, charger: 1, monitor: 1, terminal: 1, laptop: 1, secure_door: 1 }
  cctv:
    motion-radius-blocks: 16.0

security:
  enabled: true
  max-doors: 256
  open-seconds: 5

events:
  enabled: true
  auto-start: false
  auto-start-interval-seconds: 3600
  pulse-interval-seconds: 60
  wave-size: 3
  definitions:
    blood-moon: { enabled: true, duration-seconds: 300, cooldown-seconds: 1800 }
    blackout: { enabled: true, duration-seconds: 180, cooldown-seconds: 1200 }
    supply-drop: { enabled: true, duration-seconds: 60, cooldown-seconds: 1200 }
    horde-migration: { enabled: true, duration-seconds: 300, cooldown-seconds: 1800 }
    safehouse-siege: { enabled: true, duration-seconds: 300, cooldown-seconds: 1800 }
    infection-surge: { enabled: true, duration-seconds: 300, cooldown-seconds: 1800 }
    silent-night: { enabled: true, duration-seconds: 300, cooldown-seconds: 1800 }
    military-evacuation: { enabled: true, duration-seconds: 300, cooldown-seconds: 3600 }
    distress-call: { enabled: true, duration-seconds: 120, cooldown-seconds: 1800 }
    lab-breach: { enabled: true, duration-seconds: 300, cooldown-seconds: 3600 }
    lockdown: { enabled: true, duration-seconds: 120, cooldown-seconds: 1200 }
    boss-hunt: { enabled: true, duration-seconds: 600, cooldown-seconds: 3600 }
  supply-drop:
    items: [scrap, bandage, medkit, ammo_9mm]
  military-evacuation:
    extraction-radius-blocks: 16.0
    reward-item: ration_pack
    reward-amount: 1
  boss-hunt:
    reward-item: medkit
    reward-amount: 1

ai:
  enabled: true
  update-interval-ticks: 20
  detection-radius: 32.0
  alert-radius: 40.0
  noise-investigation-radius: 28.0
  target-memory-seconds: 20
  search-seconds: 12
  search-radius-blocks: 8.0
  tracked-zombies-per-update: 32

noise:
  movement-throttle-millis: 800
  sneak-radius: 3.0
  walk-radius: 8.0
  sprint-radius: 18.0
  jump-radius: 12.0
  block-break-radius: 14.0
  door-radius: 10.0

variants:
  normal: { name: '&7Zombie', health: 20.0, damage: 3.0, speed: 0.23, resistance: 0.0, spawn-chance: 1.0, drop-chance: 0.08 }
  runner: { name: '&eRunner', health: 14.0, damage: 2.5, speed: 0.34, resistance: 0.0, spawn-chance: 0.12, drop-chance: 0.10 }
