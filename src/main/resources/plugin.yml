name: ZApocalypseCore
version: '1.0.0'
main: dev.kodari.zombieapocalypse.ZombieApocalypsePlugin
api-version: '26.3'
description: Configurable zombie survival, firearm, and infection gameplay by SlimeX Development.
author: slimexplays
website: https://dsc.gg/slimexdev
commands:
  zombie:
    description: Zombie Apocalypse administration and status commands.
    usage: /zombie help|device|power|cctv
    aliases: [za]
  zrecipe:
    description: Browse and craft registered survival recipes.
    usage: /zrecipe list|search <term>|<item>|gui|craft <id>
    permission: zombie.use
  ztrade:
    description: Test configured survivor trade offers.
    usage: /ztrade list|buy <item> [amount]|sell <item> [amount]
    permission: zombie.use
  zstorage:
    description: Configure access to a held custom storage item.
    usage: /zstorage info|mode <private|team|public>
    permission: zombie.use
  zteam:
    description: Create and manage survivor teams.
    usage: /zteam create|invite|accept|leave|info|kick|disband
    permission: zombie.use
  zdashboard:
    description: Open the in-game survivor status dashboard.
    usage: /zdashboard
    permission: zombie.use
permissions:
  zombie.use:
    description: Use public Zombie Apocalypse commands.
    default: true
  zombie.admin:
    description: Administer Zombie Apocalypse features.
    default: op
  zombie.cctv:
    description: View and list powered CCTV cameras.
    default: true
  zombie.quest:
    description: View, accept and complete survivor quests.
    default: true
