
name: ZApocalypseCore Plugin Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile and Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn --version

      - name: Validate Project
        run: |
          test -f pom.xml || {
            echo "::error::pom.xml not found"
            exit 1
          }

          test -f src/main/resources/plugin.yml || {
            test -f src/main/resources/paper-plugin.yml || {
              echo "::error::Plugin descriptor not found"
              exit 1
            }
          }

      - name: Build With Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify Plugin JAR
        shell: bash
        run: |
          JAR="target/ZApocalypseCore-1.0.0.jar"

          if [ ! -f "$JAR" ]; then
            echo "::error::Expected plugin JAR not found"
            find target -maxdepth 1 -type f -print || true
            exit 1
          fi

          if ! jar tf "$JAR" | grep -Eq '(^|/)plugin.yml$|(^|/)paper-plugin.yml$'; then
            echo "::error::Plugin descriptor missing from JAR"
            exit 1
          fi

          echo "Plugin JAR verified:"
          ls -lh "$JAR"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZApocalypseCore-Plugin-JAR
          path: target/ZApocalypseCore-1.0.0.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Resource Pack and Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZApocalypseCore-ResourcePack-and-Reports
          path: |
            target/*.zip
            target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7
          
